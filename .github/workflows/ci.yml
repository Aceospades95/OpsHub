name: CI

on:
  push:
    branches:
      - main
      - "claude/*"
      - "r11/*"
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Lint + test + build + PII gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: PII gate
        run: bash scripts/check-no-pii.sh

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker-bloat-check:
    name: Docker image content audit
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t opshub:r11 .

      - name: Assert no seed/cleanup/test files in runtime image
        run: IMAGE=opshub:r11 bash scripts/check-docker-bloat.sh
